- name: Check if Apache log exists
  stat:
    path: /var/log/apache2/access.log
  register: stat_result
- name: Add filter for unwanted monitoring tools
  when: stat_result.stat.exists
  copy:
    dest: '/etc/fail2ban/filter.d/apache-abusive-monitoring.local'
    mode: 0644
    owner: root
    group: root
    content: |
      [Definition]
      failregex = ^<HOST> .* 429 [0-9]+ "-" "SynxHealthTest"$
  notify:
    - reload fail2ban

- name: Add filter for clients which get a lot of HTTP 429
  when: stat_result.stat.exists
  copy:
    dest: '/etc/fail2ban/filter.d/apache-{{ item }}.local'
    mode: 0644
    owner: root
    group: root
    content: |
      [Definition]
      failregex = ^<HOST> .* {{ item }} [0-9]+ ".+" ".+"$
  loop:
    - "403"
    - "429"
  notify:
    - reload fail2ban

- name: Customise fail2ban
  when: stat_result.stat.exists
  copy:
    dest: '/etc/fail2ban/jail.d/apache-abusive-monitoring.local'
    mode: 0644
    owner: root
    group: root
    content: |
      [apache-abusive-monitoring]
      enabled = true
      port = http,https
      filter = apache-abusive-monitoring
      logpath  = %(apache_access_log)s
      maxretry = 30
      # We have to use ufw because the resulting chain name f2b/apache-abusive-monitoring is too long for a name of an iptable chain.
      banaction = ufw
      bantime = 96h
      findtime = 1h
      # Avoid accidential banning of Deutsche Bahn in order to keep email inbox small :-)
      ignoreip = 81.200.197.0/24

      [apache-403]
      enabled = true
      port = http,https
      filter = apache-403
      logpath  = %(apache_access_log)s
      maxretry = 10000
      banaction = ufw
      bantime = 12h
      findtime = 12h
      # Avoid accidential banning of major railway operators: DB, CFL, SNCF
      # Avoid accidential banning of Datacamp customers because railmap uses it, too.
      ignoreip = 81.200.197.0/24 194.154.213.0/24 171.16.0.0/18 185.24.11.19/24 185.93.3.244/24 185.152.64.17/24 79.127.237.132/24 79.127.243.187/24 89.187.165.194/24

      [apache-429]
      enabled = true
      port = http,https
      filter = apache-429
      logpath  = %(apache_access_log)s
      maxretry = 5000
      banaction = ufw
      bantime = 24h
      findtime = 12h
      # Avoid accidential banning of Deutsche Bahn in order to keep email inbox small :-)
      # Avoid accidential banning of Datacamp customers because railmap uses it, too.
      ignoreip = 81.200.197.0/24 185.24.11.19/24 185.93.3.244/24 185.152.64.17/24 79.127.237.132/24 79.127.243.187/24 89.187.165.194/24
  notify:
    - reload fail2ban

- name: Customise fail2ban
  copy:
    dest: '/etc/fail2ban/jail.local'
    mode: 0644
    owner: root
    group: root
    content: |
        [DEFAULT]
        bantime = 20m
        findtime = 10m
        maxretry = 15
        [sshd]
        enabled = true
        {% if ansible_distribution_major_version|int >= 12 and ansible_distribution == "Debian" %}backend = systemd{% endif %}
  notify:
    - reload fail2ban
