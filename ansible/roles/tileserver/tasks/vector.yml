- name: "Create Debian packages"
  apt:
    name: "node-yaml"

- name: "Create build directory"
  file:
    path: "/opt/OpenRailwayMap-vector/build"
    owner: root
    mode: '0755'
    group: root
    state: directory

- name: "Create symlink to global Node module path"
  file:
    src: "/usr/share/node_modules"
    dest: "/opt/OpenRailwayMap-vector/import/node_modules"
    state: "link"
    owner: root
    group: root

- name: "Build Lua and SQL files using Make"
  make:
    chdir: /opt/OpenRailwayMap-vector
    target: all

- name: Create script directory for post-import scripts
  file:
    path: '{{ tileserver_script_dir }}/post-import.d'
    owner: root
    group: root
    state: directory
    mode: '0755'

- name: Create post-import scripts
  copy:
    dest: '{{ tileserver_script_dir }}/post-import.d/'
    src: '{{ item }}'
    owner: root
    group: root
    mode: '0755'
  loop:
    - 01_reduce_data
    - 02_transform_data
    - 03_create_update_functions_views

- name: Create post-update scripts
  copy:
    dest: '{{ tileserver_script_dir }}/post-update.d/'
    src: '{{ item }}'
    owner: root
    group: root
    mode: '0755'
  loop:
    - 01_reduce_data
    - 02_transform_data
    - 3_refresh_after_diff_update
